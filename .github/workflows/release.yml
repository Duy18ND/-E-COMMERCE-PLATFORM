name: Release and Publish Docker Images

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Build and Push Microservice Images to GHCR
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Continuous Integration (CI)' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            context: backend
            dockerfile: backend/auth-service/Dockerfile
          - name: product-service
            context: backend
            dockerfile: backend/product-service/Dockerfile
          - name: order-service
            context: backend
            dockerfile: backend/order-service/Dockerfile
          - name: payment-service
            context: backend
            dockerfile: backend/payment-service/Dockerfile
          - name: discovery-server
            context: backend
            dockerfile: backend/discovery-server/Dockerfile
          - name: api-gateway
            context: backend
            dockerfile: backend/api-gateway/Dockerfile
          - name: chatbot-service
            context: backend
            dockerfile: backend/chatbot-service/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build-args: |
              VITE_API_URL=/api/v1
              VITE_USE_MOCK_AUTH=false

    steps:
      - name: Checkout Trusted Repository History
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve & Verify Exact Release Commit in Trusted Main History
        id: resolve-ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          GITHUB_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          if ! [[ "$OWNER_LC" =~ ^[a-z0-9._-]+$ ]]; then
            echo "::error ::Invalid repository owner format."
            exit 1
          fi

          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "::error ::Release is strictly restricted to workflow_run after Continuous Integration (CI) succeeds on main."
            exit 1
          fi
          if [ "$WORKFLOW_RUN_NAME" != "Continuous Integration (CI)" ] || [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
            echo "::error ::workflow_run must originate from a successful 'Continuous Integration (CI)' run."
            exit 1
          fi
          if [ "$WORKFLOW_RUN_EVENT" != "push" ] || [ "$WORKFLOW_RUN_HEAD_REPO" != "$GITHUB_REPO" ]; then
            echo "::error ::Refusing workflow_run from pull_request or external fork repository."
            exit 1
          fi
          if [ "$WORKFLOW_RUN_BRANCH" != "main" ]; then
            echo "::error ::workflow_run releases are restricted to the 'main' branch."
            exit 1
          fi
          if ! [[ "$WORKFLOW_RUN_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error ::Invalid or missing workflow_run.head_sha."
            exit 1
          fi
          EXPECTED_SHA="$WORKFLOW_RUN_SHA"

          MAIN_HEAD=$(git rev-parse --verify "refs/remotes/origin/main^{commit}" 2>/dev/null || git rev-parse --verify "refs/heads/main^{commit}" 2>/dev/null || true)
          RESOLVED_COMMIT=$(git rev-parse --verify "${EXPECTED_SHA}^{commit}" 2>/dev/null || true)
          if [ -z "$MAIN_HEAD" ] || [ -z "$RESOLVED_COMMIT" ] || [ "$RESOLVED_COMMIT" != "$EXPECTED_SHA" ]; then
            echo "::error ::Target commit '${EXPECTED_SHA}' could not be resolved in trusted repository history."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$MAIN_HEAD"; then
            echo "::error ::Commit '${EXPECTED_SHA}' does not belong to 'main' branch history. Refusing to release non-main or untrusted code."
            exit 1
          fi
          git checkout --detach "$EXPECTED_SHA"

          FULL_SHA=$(git rev-parse HEAD)
          if [ "$FULL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error ::Checked-out commit '${FULL_SHA}' does not match expected release commit '${EXPECTED_SHA}'."
            exit 1
          fi
          PREFIX_7="${FULL_SHA:0:7}"
          RESOLVED_7=$(git rev-parse --verify "${PREFIX_7}^{commit}" 2>/dev/null || true)
          if [ -z "$RESOLVED_7" ] || [ "$RESOLVED_7" != "$FULL_SHA" ]; then
            echo "::error ::7-char SHA prefix '${PREFIX_7}' is not unique or does not resolve to '${FULL_SHA}'."
            exit 1
          fi

          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${PREFIX_7}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "Verified unique 7-char SHA tag on main: sha-${PREFIX_7} -> ${FULL_SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ steps.resolve-ref.outputs.owner_lc }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ steps.resolve-ref.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.resolve-ref.outputs.full_sha }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Continuous Integration (CI)' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service.build-args }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  # ─────────────────────────────────────────────────────────────
  #  Publish Release Manifest Artifact for Continuous Deployment
  # ─────────────────────────────────────────────────────────────
  publish-manifest:
    name: Publish Release Manifest
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
    steps:
      - name: Checkout Trusted Repository History
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Generate Release Manifest Artifact
        id: manifest
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          GITHUB_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          if ! [[ "$OWNER_LC" =~ ^[a-z0-9._-]+$ ]]; then
            echo "::error ::Invalid repository owner format."
            exit 1
          fi

          MAIN_HEAD=$(git rev-parse --verify "refs/remotes/origin/main^{commit}" 2>/dev/null || git rev-parse --verify "refs/heads/main^{commit}" 2>/dev/null || true)
          RESOLVED_COMMIT=$(git rev-parse --verify "${WORKFLOW_RUN_SHA}^{commit}" 2>/dev/null || true)
          if [ -z "$MAIN_HEAD" ] || [ -z "$RESOLVED_COMMIT" ] || [ "$RESOLVED_COMMIT" != "$WORKFLOW_RUN_SHA" ]; then
            echo "::error ::Target commit '${WORKFLOW_RUN_SHA}' could not be resolved in trusted repository history."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$WORKFLOW_RUN_SHA" "$MAIN_HEAD"; then
            echo "::error ::Commit '${WORKFLOW_RUN_SHA}' does not belong to 'main' branch history. Refusing to generate release manifest."
            exit 1
          fi

          PREFIX_7="${WORKFLOW_RUN_SHA:0:7}"
          RELEASE_TAG="sha-${PREFIX_7}"

          mkdir -p release-manifest
          cat <<EOF > release-manifest/manifest.env
          RELEASE_TAG=${RELEASE_TAG}
          RELEASE_FULL_SHA=${WORKFLOW_RUN_SHA}
          RELEASE_SHORT_SHA=${PREFIX_7}
          RELEASE_OWNER_LC=${OWNER_LC}
          RELEASE_RUN_ID=${RELEASE_RUN_ID}
          EOF

          cat <<EOF > release-manifest/manifest.json
          {
            "tag": "${RELEASE_TAG}",
            "full_sha": "${WORKFLOW_RUN_SHA}",
            "short_sha": "${PREFIX_7}",
            "owner": "${OWNER_LC}",
            "run_id": "${RELEASE_RUN_ID}",
            "repository": "${GITHUB_REPO}",
            "published_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

          echo "Generated release manifest:"
          cat release-manifest/manifest.env

      - name: Upload Release Manifest Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: release-manifest/
          retention-days: 7
          if-no-files-found: error
