name: Release and Publish Docker Images

on:
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Custom Image Tag (leave empty for default commit SHA / latest)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Build and Push Microservice Images to GHCR
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            context: backend
            dockerfile: backend/auth-service/Dockerfile
          - name: product-service
            context: backend
            dockerfile: backend/product-service/Dockerfile
          - name: order-service
            context: backend
            dockerfile: backend/order-service/Dockerfile
          - name: payment-service
            context: backend
            dockerfile: backend/payment-service/Dockerfile
          - name: discovery-server
            context: backend
            dockerfile: backend/discovery-server/Dockerfile
          - name: api-gateway
            context: backend
            dockerfile: backend/api-gateway/Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build-args: |
              VITE_API_URL=/api/v1
              VITE_USE_MOCK_AUTH=false

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Convert Repository Owner to Lowercase
        id: repo-owner
        run: |
          echo "owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo-owner.outputs.owner_lc }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.service.build-args }}
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
