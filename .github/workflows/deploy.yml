name: Continuous Deployment (CD) to Production VPS

on:
  workflow_run:
    workflows: ["Release and Publish Docker Images"]
    types: [ completed ]
    branches: [ master ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image Tag to deploy (e.g. sha-xxxxxxx or latest)'
        required: false
        default: 'latest'
      run_backup:
        description: 'Perform automated MySQL backup before deployment'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Pre-flight Checks & Secret Validation
  # ─────────────────────────────────────────────────────────────
  preflight-check:
    name: Validate Deployment Prerequisites
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      configured: ${{ steps.check-secrets.outputs.configured }}
      deploy_tag: ${{ steps.resolve-tag.outputs.tag }}
      repo_owner: ${{ steps.repo-owner.outputs.owner_lc }}
    steps:
      - name: Convert Repository Owner to Lowercase
        id: repo-owner
        run: |
          echo "owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Resolve Image Tag to Deploy
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="sha-$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)"
          else
            TAG="latest"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Deployment Image Tag: ${TAG}"

      - name: Verify Required GitHub Secrets
        id: check-secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.VPS_HOST }}" ]; then MISSING="${MISSING} VPS_HOST"; fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then MISSING="${MISSING} VPS_USER"; fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then MISSING="${MISSING} VPS_SSH_KEY"; fi

          if [ -n "$MISSING" ]; then
            echo "::warning ::Required VPS Deployment Secrets missing:${MISSING}."
            echo "::warning ::To enable automated deployment, configure these secrets in GitHub Repository Settings -> Secrets and variables -> Actions."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

  # ─────────────────────────────────────────────────────────────
  #  Deploy to Production VPS via SSH
  # ─────────────────────────────────────────────────────────────
  deploy-to-vps:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [ preflight-check ]
    if: needs.preflight-check.outputs.configured == 'true'
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL || 'http://localhost' }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Deployment on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: |
            IMAGE_TAG,
            RUN_BACKUP,
            REPO_OWNER,
            GHCR_TOKEN,
            GHCR_USER
          IMAGE_TAG: ${{ needs.preflight-check.outputs.deploy_tag }}
          RUN_BACKUP: ${{ inputs.run_backup || true }}
          REPO_OWNER: ${{ needs.preflight-check.outputs.repo_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_DIR="/opt/shopmart"
            BACKUP_ROOT="${DEPLOY_DIR}/backups"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            echo "=== [1/6] Preparing Deployment Directory at ${DEPLOY_DIR} ==="
            sudo mkdir -p "${DEPLOY_DIR}" "${DEPLOY_DIR}/docker/mysql" "${DEPLOY_DIR}/docker/nginx" "${BACKUP_ROOT}"
            sudo chown -R $USER:$USER "${DEPLOY_DIR}"
            cd "${DEPLOY_DIR}"

            echo "=== [2/6] Verifying Production Environment Configuration (.env) ==="
            if [ ! -f .env ]; then
              echo "ERROR: Production .env file not found in ${DEPLOY_DIR}!"
              echo "Please copy .env.prod.example to .env and configure strong production secrets."
              exit 1
            fi

            # Authenticate to GHCR if token provided
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "Authenticating to GitHub Container Registry..."
              echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            fi

            echo "=== [3/6] Safe Pre-Deployment Database Backup ==="
            if [ "${RUN_BACKUP}" = "true" ] || [ "${RUN_BACKUP}" = "1" ]; then
              if docker ps -q -f name=ecommerce-mysql | grep -q .; then
                echo "Creating pre-deployment MySQL dump at ${BACKUP_ROOT}/${TIMESTAMP}_pre_deploy.sql ..."
                source .env
                docker exec ecommerce-mysql mysqldump -u root -p"${MYSQL_ROOT_PASSWORD}" --all-databases > "${BACKUP_ROOT}/${TIMESTAMP}_pre_deploy.sql"
                echo "Backup completed successfully ($(du -h "${BACKUP_ROOT}/${TIMESTAMP}_pre_deploy.sql" | cut -f1))."
              else
                echo "MySQL container is not currently running. Skipping online dump."
              fi
            fi

            echo "=== [4/6] Pulling Updated Docker Images (${IMAGE_TAG}) ==="
            export IMAGE_REGISTRY="ghcr.io"
            export IMAGE_REPO_OWNER="${REPO_OWNER}"
            export IMAGE_TAG="${IMAGE_TAG}"

            # Save previous working tag for rollback
            PREVIOUS_TAG=$(grep "^IMAGE_TAG=" .env 2>/dev/null | cut -d'=' -f2 || echo "latest")
            echo "Current Active Tag: ${PREVIOUS_TAG} -> Deploying Tag: ${IMAGE_TAG}"

            docker compose -f docker-compose.prod.yml pull

            echo "=== [5/6] Starting Rolling Container Update ==="
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== [6/6] Automated Healthcheck & Post-Deployment Smoke Test ==="
            MAX_ATTEMPTS=24 # 24 * 5s = 120s
            ATTEMPT=0
            ALL_HEALTHY=false

            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              ATTEMPT=$((ATTEMPT + 1))
              echo "Healthcheck probe attempt ${ATTEMPT}/${MAX_ATTEMPTS}..."

              UNHEALTHY_COUNT=$(docker compose -f docker-compose.prod.yml ps --format json | grep -c '"Health": "unhealthy"' || true)
              STARTING_COUNT=$(docker compose -f docker-compose.prod.yml ps --format json | grep -c '"Health": "starting"' || true)

              if [ "$UNHEALTHY_COUNT" -eq 0 ] && [ "$STARTING_COUNT" -eq 0 ]; then
                ALL_HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$ALL_HEALTHY" = "true" ]; then
              echo "Verifying Public HTTP Endpoints..."
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1/healthz || echo "000")
              if [ "$HTTP_STATUS" = "200" ]; then
                echo "SUCCESS: Nginx healthz returned 200 OK."
                # Update recorded active tag in .env
                sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env || echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
                echo "DEPLOYMENT COMPLETE: Version ${IMAGE_TAG} is LIVE and HEALTHY."
              else
                echo "WARNING: Nginx returned HTTP ${HTTP_STATUS}. Triggering Rollback."
                ALL_HEALTHY=false
              fi
            fi

            if [ "$ALL_HEALTHY" != "true" ]; then
              echo "CRITICAL: Deployment verification FAILED! Initiating Rollback to ${PREVIOUS_TAG}..."
              export IMAGE_TAG="${PREVIOUS_TAG}"
              docker compose -f docker-compose.prod.yml pull || true
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
              echo "Rollback initiated. Check logs on VPS:"
              docker compose -f docker-compose.prod.yml logs --tail 30
              exit 1
            fi
