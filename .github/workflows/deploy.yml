name: Continuous Deployment (CD) to Production VPS

on:
  workflow_run:
    workflows: ["Release and Publish Docker Images"]
    types: [ completed ]
    branches: [ main, master ]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────
  #  Pre-flight Checks & Immutable 7-Char SHA / Commit Validation
  # ─────────────────────────────────────────────────────────────
  preflight-check:
    name: Validate Deployment Prerequisites
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Release and Publish Docker Images' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'master') &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.event != 'pull_request_target' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    outputs:
      configured: ${{ steps.check-secrets.outputs.configured }}
      deploy_tag: ${{ steps.resolve-tag.outputs.tag }}
      deploy_sha: ${{ steps.resolve-tag.outputs.full_sha }}
      repo_owner: ${{ steps.repo-owner.outputs.owner_lc }}
    steps:
      - name: Checkout Trusted Repository History
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Convert Repository Owner to Lowercase
        id: repo-owner
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          OWNER_LC=$(printf '%s' "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          if ! [[ "$OWNER_LC" =~ ^[a-z0-9._-]+$ ]]; then
            echo "::error ::Invalid repository owner format."
            exit 1
          fi
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

      - name: Download Release Manifest Artifact
        id: download-manifest
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: release-manifest
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve & Validate Immutable 7-Char SHA Tag & Source Commit
        id: resolve-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          GITHUB_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          MAIN_HEAD=$(git rev-parse --verify "refs/remotes/origin/main^{commit}" 2>/dev/null || git rev-parse --verify "refs/heads/main^{commit}" 2>/dev/null || true)
          if [ -z "$MAIN_HEAD" ]; then
            echo "::error ::Could not resolve origin/main in trusted repository."
            exit 1
          fi

          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "::error ::Production deployment is strictly restricted to workflow_run after Release and Publish Docker Images succeeds."
            exit 1
          fi
          if [ "$WORKFLOW_RUN_NAME" != "Release and Publish Docker Images" ] || [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
            echo "::error ::workflow_run must originate from a successful 'Release and Publish Docker Images' run."
            exit 1
          fi
          if [ "$WORKFLOW_RUN_EVENT" = "pull_request" ] || [ "$WORKFLOW_RUN_EVENT" = "pull_request_target" ] || [ "$WORKFLOW_RUN_HEAD_REPO" != "$GITHUB_REPO" ]; then
            echo "::error ::Refusing workflow_run from pull_request or external fork repository."
            exit 1
          fi
          if [ "$WORKFLOW_RUN_BRANCH" != "main" ] && [ "$WORKFLOW_RUN_BRANCH" != "master" ]; then
            echo "::error ::workflow_run deployments are restricted to the 'main' or 'master' branch context."
            exit 1
          fi

          # ── 1. Manifest file existence check (NO FALLBACK) ──
          MANIFEST_FILE="release-manifest/manifest.env"
          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "::error ::Release manifest file '${MANIFEST_FILE}' was not found. Artifact download failed or manifest was not published. Production deployment aborted."
            exit 1
          fi

          # ── 2. Read and validate mandatory manifest fields ──
          MANIFEST_TAG=$(grep '^RELEASE_TAG=' "$MANIFEST_FILE" | cut -d'=' -f2- | tr -d '\r')
          MANIFEST_FULL_SHA=$(grep '^RELEASE_FULL_SHA=' "$MANIFEST_FILE" | cut -d'=' -f2- | tr -d '\r')
          MANIFEST_SHORT_SHA=$(grep '^RELEASE_SHORT_SHA=' "$MANIFEST_FILE" | cut -d'=' -f2- | tr -d '\r')
          MANIFEST_OWNER_LC=$(grep '^RELEASE_OWNER_LC=' "$MANIFEST_FILE" | cut -d'=' -f2- | tr -d '\r')
          MANIFEST_RUN_ID=$(grep '^RELEASE_RUN_ID=' "$MANIFEST_FILE" | cut -d'=' -f2- | tr -d '\r')

          if [ -z "$MANIFEST_TAG" ] || [ -z "$MANIFEST_FULL_SHA" ] || [ -z "$MANIFEST_SHORT_SHA" ] || [ -z "$MANIFEST_OWNER_LC" ] || [ -z "$MANIFEST_RUN_ID" ]; then
            echo "::error ::Release manifest is missing one or more required fields (RELEASE_TAG, RELEASE_FULL_SHA, RELEASE_SHORT_SHA, RELEASE_OWNER_LC, RELEASE_RUN_ID)."
            exit 1
          fi

          # ── 3. Validate field formats ──
          if ! [[ "$MANIFEST_FULL_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error ::Invalid RELEASE_FULL_SHA format in manifest: '${MANIFEST_FULL_SHA}' (must be 40 hex characters)."
            exit 1
          fi
          if ! [[ "$MANIFEST_SHORT_SHA" =~ ^[0-9a-fA-F]{7}$ ]]; then
            echo "::error ::Invalid RELEASE_SHORT_SHA format in manifest: '${MANIFEST_SHORT_SHA}' (must be 7 hex characters)."
            exit 1
          fi
          if ! [[ "$MANIFEST_TAG" =~ ^sha-[0-9a-fA-F]{7}$ ]]; then
            echo "::error ::Invalid RELEASE_TAG format in manifest: '${MANIFEST_TAG}' (must match 'sha-<7char>')."
            exit 1
          fi
          if ! [[ "$MANIFEST_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error ::Invalid RELEASE_RUN_ID format in manifest: '${MANIFEST_RUN_ID}'."
            exit 1
          fi

          # ── 4. Verify owner matches lowercase repository owner ──
          EXPECTED_OWNER_LC=$(printf '%s' "${GITHUB_REPO%%/*}" | tr '[:upper:]' '[:lower:]')
          if [ "$MANIFEST_OWNER_LC" != "$EXPECTED_OWNER_LC" ]; then
            echo "::error ::Manifest OWNER_LC '${MANIFEST_OWNER_LC}' does not match expected repository owner '${EXPECTED_OWNER_LC}'."
            exit 1
          fi

          # ── 5. Verify run-id matches triggering Release workflow run ──
          if [ "$MANIFEST_RUN_ID" != "$TRIGGER_RUN_ID" ]; then
            echo "::error ::Manifest run ID (${MANIFEST_RUN_ID}) does not match triggering Release workflow run ID (${TRIGGER_RUN_ID}). Refusing cross-run artifact."
            exit 1
          fi

          # ── 6. Verify tag matches SHA prefix ──
          EXPECTED_PREFIX="${MANIFEST_FULL_SHA:0:7}"
          if [ "$MANIFEST_SHORT_SHA" != "$EXPECTED_PREFIX" ]; then
            echo "::error ::Manifest SHORT_SHA '${MANIFEST_SHORT_SHA}' does not match FULL_SHA prefix '${EXPECTED_PREFIX}'."
            exit 1
          fi
          EXPECTED_TAG="sha-${EXPECTED_PREFIX}"
          if [ "$MANIFEST_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error ::Manifest TAG '${MANIFEST_TAG}' does not match expected '${EXPECTED_TAG}' from FULL_SHA."
            exit 1
          fi

          # ── 7. Verify commit exists and belongs to origin/main history ──
          RESOLVED_COMMIT=$(git rev-parse --verify "${MANIFEST_FULL_SHA}^{commit}" 2>/dev/null || true)
          if [ -z "$RESOLVED_COMMIT" ] || [ "$RESOLVED_COMMIT" != "$MANIFEST_FULL_SHA" ]; then
            echo "::error ::Release commit '${MANIFEST_FULL_SHA}' does not exist in trusted repository history."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$MANIFEST_FULL_SHA" "$MAIN_HEAD" 2>/dev/null; then
            echo "::error ::Commit '${MANIFEST_FULL_SHA}' is not an ancestor of 'origin/main' (${MAIN_HEAD}). Refusing untrusted or non-main deploy."
            exit 1
          fi

          # ── 8. Verify 7-char prefix uniqueness ──
          RESOLVED_7=$(git rev-parse --verify "${MANIFEST_SHORT_SHA}^{commit}" 2>/dev/null || true)
          if [ -z "$RESOLVED_7" ] || [ "$RESOLVED_7" != "$MANIFEST_FULL_SHA" ]; then
            echo "::error ::7-char SHA prefix '${MANIFEST_SHORT_SHA}' is ambiguous or does not resolve to '${MANIFEST_FULL_SHA}'."
            exit 1
          fi

          echo "tag=${MANIFEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${MANIFEST_FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "Target Immutable Image Tag: ${MANIFEST_TAG} (verified main commit: ${MANIFEST_FULL_SHA}, release run: ${MANIFEST_RUN_ID})"

      - name: Verify Required GitHub Secrets (Including SSH Host Fingerprint)
        id: check-secrets
        env:
          HAS_VPS_HOST: ${{ secrets.VPS_HOST != '' }}
          HAS_VPS_USER: ${{ secrets.VPS_USER != '' }}
          HAS_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          HAS_VPS_FINGERPRINT: ${{ secrets.VPS_SSH_FINGERPRINT != '' }}
        run: |
          MISSING=""
          if [ "$HAS_VPS_HOST" != "true" ]; then MISSING="${MISSING} VPS_HOST"; fi
          if [ "$HAS_VPS_USER" != "true" ]; then MISSING="${MISSING} VPS_USER"; fi
          if [ "$HAS_VPS_SSH_KEY" != "true" ]; then MISSING="${MISSING} VPS_SSH_KEY"; fi
          if [ "$HAS_VPS_FINGERPRINT" != "true" ]; then MISSING="${MISSING} VPS_SSH_FINGERPRINT"; fi

          if [ -n "$MISSING" ]; then
            echo "::error ::Required VPS Deployment Secrets missing:${MISSING}. SSH host key verification (VPS_SSH_FINGERPRINT) is mandatory."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify All 8 Microservice Image Packages in GHCR
        env:
          REPO_OWNER: ${{ steps.repo-owner.outputs.owner_lc }}
          IMAGE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          APP_SERVICES="discovery-server auth-service product-service order-service payment-service chatbot-service api-gateway frontend"
          echo "Verifying existence of all 8 image packages in GHCR with tag '${IMAGE_TAG}'..."
          MISSING_IMAGES=""
          for svc in $APP_SERVICES; do
            image_ref="ghcr.io/${REPO_OWNER}/${svc}:${IMAGE_TAG}"
            echo -n "Checking ${image_ref} ... "
            if docker manifest inspect "$image_ref" >/dev/null 2>&1; then
              echo "EXISTS"
            else
              echo "NOT FOUND"
              MISSING_IMAGES="${MISSING_IMAGES} ${image_ref}"
            fi
          done

          if [ -n "$MISSING_IMAGES" ]; then
            echo "::error ::The following required release images are missing from GHCR:${MISSING_IMAGES}. Production deployment aborted."
            exit 1
          fi
          echo "Successfully verified all 8 microservice packages exist in GHCR with tag ${IMAGE_TAG}."

  # ─────────────────────────────────────────────────────────────
  #  Safe Staged Deployment to Production VPS via SSH
  # ─────────────────────────────────────────────────────────────
  deploy-to-vps:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    needs: [ preflight-check ]
    if: needs.preflight-check.outputs.configured == 'true'
    environment:
      name: production
    steps:
      - name: Checkout Trusted Repository History
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify & Align Trusted Main Commit for Deployment
        env:
          DEPLOY_TAG: ${{ needs.preflight-check.outputs.deploy_tag }}
          DEPLOY_SHA: ${{ needs.preflight-check.outputs.deploy_sha }}
        run: |
          if ! [[ "$DEPLOY_TAG" =~ ^sha-[0-9a-fA-F]{7}$ ]]; then
            echo "::error ::Invalid deploy_tag '${DEPLOY_TAG}'."
            exit 1
          fi
          if ! [[ "$DEPLOY_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error ::Invalid deploy_sha '${DEPLOY_SHA}'."
            exit 1
          fi
          if [ "sha-${DEPLOY_SHA:0:7}" != "$DEPLOY_TAG" ]; then
            echo "::error ::deploy_tag '${DEPLOY_TAG}' does not match deploy_sha '${DEPLOY_SHA}'."
            exit 1
          fi

          MAIN_HEAD=$(git rev-parse --verify "refs/remotes/origin/main^{commit}" 2>/dev/null || git rev-parse --verify "refs/heads/main^{commit}" 2>/dev/null || true)
          TARGET_COMMIT=$(git rev-parse --verify "${DEPLOY_SHA}^{commit}" 2>/dev/null || true)
          if [ -z "$MAIN_HEAD" ] || [ -z "$TARGET_COMMIT" ] || [ "$TARGET_COMMIT" != "$DEPLOY_SHA" ]; then
            echo "::error ::Could not resolve unique commit for '${DEPLOY_SHA}' in trusted repository."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TARGET_COMMIT" "$MAIN_HEAD" 2>/dev/null; then
            echo "::error ::Commit '${TARGET_COMMIT}' (${DEPLOY_TAG}) is not in 'main' branch history."
            exit 1
          fi
          git checkout --detach "$TARGET_COMMIT"

          FULL_SHA=$(git rev-parse HEAD)
          if [ "$FULL_SHA" != "$TARGET_COMMIT" ]; then
            echo "::error ::Checked-out commit '${FULL_SHA}' does not match expected target commit '${TARGET_COMMIT}'."
            exit 1
          fi
          echo "Aligned deployment workspace to verified main commit: ${FULL_SHA} (${DEPLOY_TAG})"

      - name: Sync Base & Prod Compose, Migrations, Nginx Prod & Backup Scripts to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          source: "backend/docker-compose.yml,backend/docker-compose.prod.yml,backend/.env.prod.example,backend/docker/mysql/init.sql,backend/docker/mysql/migrations/*,backend/docker/nginx/nginx.prod.conf,scripts/backup/*,scripts/deploy/vps-deploy.sh"
          target: "/tmp/shopmart-deploy"

      - name: Execute Safe Remote SSH Deployment on VPS
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          IMAGE_TAG: ${{ needs.preflight-check.outputs.deploy_tag }}
          REPO_OWNER: ${{ needs.preflight-check.outputs.repo_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PAT: ${{ secrets.GHCR_TOKEN }}
          GHCR_PAT_USER: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: IMAGE_TAG,REPO_OWNER,GITHUB_TOKEN,GHCR_PAT,GHCR_PAT_USER,GH_ACTOR
          script_stop: true
          script: |
            set -euo pipefail
            chmod 700 /tmp/shopmart-deploy/scripts/deploy/vps-deploy.sh
            sed -i 's/\r$//' /tmp/shopmart-deploy/scripts/deploy/vps-deploy.sh
            exec /bin/bash /tmp/shopmart-deploy/scripts/deploy/vps-deploy.sh
