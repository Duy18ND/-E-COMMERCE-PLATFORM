server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ─── Redis (for Rate Limiting filter) ───────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redispassword}
      timeout: 2000ms

  # ─── Spring Cloud Gateway Routes ────────────────────────────
  cloud:
    gateway:
      # Enable route discovery from Eureka (auto-routes lb://<service-name>)
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # Default filters applied to ALL routes
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      # Explicit routes
      routes:

        # ── 1. Auth Service (Public: Login, Register, Refresh) ─────────
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: auth-cb
                fallbackUri: forward:/fallback/auth

        - id: auth-service-protected
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/users/**,/api/v1/admin/users/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: auth-cb
                fallbackUri: forward:/fallback/auth

        # ── 2. Product Service — Public Read APIs (GET) ────────────────
        - id: product-service-public
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
            - Method=GET
          filters:
            - StripPrefix=0
            - name: CircuitBreaker
              args:
                name: product-cb
                fallbackUri: forward:/fallback/product

        # ── 3. Product Service — Data Mutation APIs (POST, PUT, DELETE, PATCH)
        - id: product-service-mutation
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**
            - Method=POST,PUT,DELETE,PATCH
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: product-cb
                fallbackUri: forward:/fallback/product

        # ── 4. Order Service — Checkout Anti-Spam Rate Limiter ─────────
        - id: order-service-checkout
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/checkout
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 2
                redis-rate-limiter.burstCapacity: 5
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: order-cb
                fallbackUri: forward:/fallback/order

        # ── 5. Order Service — General Orders & Cart ───────────────────
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**,/api/v1/cart/**,/api/v1/admin/orders/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - name: CircuitBreaker
              args:
                name: order-cb
                fallbackUri: forward:/fallback/order

        # ── 6. Payment Service ─────────────────────────────────────────
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - StripPrefix=0
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: payment-cb
                fallbackUri: forward:/fallback/payment

      # ── CORS Global Configuration ────────────────────────────────────
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:8080"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

# ─── JWT Secret Configuration (Shared with auth-service) ─────
jwt:
  secret: ${JWT_SECRET:ecommerce-super-secret-key-change-in-production-must-be-256-bits}

# ─── Eureka Client ───────────────────────────────────────────
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:eurekapassword@localhost:8761/eureka/}

# ─── Resilience4j Circuit Breaker config ─────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      auth-cb:
        base-config: default
      product-cb:
        base-config: default
      order-cb:
        base-config: default
      payment-cb:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      auth-cb:
        base-config: default
      product-cb:
        base-config: default
      order-cb:
        base-config: default
      payment-cb:
        base-config: default

# ─── Actuator ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.ecommerce.gateway: DEBUG
    reactor.netty: WARN
