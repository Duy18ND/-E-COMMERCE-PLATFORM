plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

description = 'API Gateway (Spring Cloud Gateway)'

dependencies {
    // Spring Cloud Gateway (WebFlux-based reactive gateway)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

    // Eureka Client — for lb:// load-balanced routing
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

    // Actuator — for health checks / metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Circuit Breaker (Resilience4j) — for Gateway filters (Day 2+)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    // Redis Reactive — for Rate Limiting filter
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
}
