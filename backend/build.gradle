plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
}

// ─────────────────────────────────────────────────────────────
// Properties shared across ALL submodules
// ─────────────────────────────────────────────────────────────
ext {
    set('springCloudVersion', '2023.0.3')
    set('javaVersion', JavaVersion.VERSION_21)
    set('lombokVersion', '1.18.32')
    set('jjwtVersion', '0.12.5')
    set('springdocVersion', '2.5.0')
    set('mapstructVersion', '1.5.5.Final')
}

// ─────────────────────────────────────────────────────────────
// Configuration applied to every subproject
// ─────────────────────────────────────────────────────────────
subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    group   = 'com.ecommerce'
    version = '1.0.0-SNAPSHOT'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        mavenCentral()
    }

    // Import Spring Cloud BOM so all submodules share the same managed versions
    dependencyManagement {
        imports {
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    // Dependencies available in every submodule
    dependencies {
        compileOnly         "org.projectlombok:lombok:${lombokVersion}"
        annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
        testCompileOnly     "org.projectlombok:lombok:${lombokVersion}"
        testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    // Ensure UTF-8 encoding for all compile tasks
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
