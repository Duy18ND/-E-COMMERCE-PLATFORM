# ═══════════════════════════════════════════════════════════════
#  ShopMart — Sprint 1 Lite Deployment (Ultra-Optimized for VPS)
#  Target: VPS Ubuntu 24.04 (1 vCPU, 1 GB RAM, 20 GB SSD)
#
#  Services Included (Sprint 1 Minimal Core):
#    1. mysql           (MySQL 8.0, performance_schema=OFF, 32MB buffer pool)
#    2. redis           (Redis 7.2 Alpine, maxmemory 16MB)
#    3. auth-service    (Spring Boot 3.3.4, SerialGC, C1 compiler, Eureka OFF)
#    4. product-service (Spring Boot 3.3.4, SerialGC, C1 compiler, Eureka OFF)
#    5. api-gateway     (Spring Cloud Gateway, SerialGC, SimpleDiscovery)
#    6. frontend        (React 18 + Vite 5 SPA on Nginx)
#    7. nginx           (Reverse Proxy entrypoint on Port 80)
#
#  Services Safely Omitted (Sprint 2 / Unnecessary in Sprint 1):
#    - discovery-server (Eureka) : Saved ~325 MB RAM (replaced by SimpleDiscovery)
#    - kafka broker              : Saved ~699 MB RAM
#    - zookeeper                 : Saved ~172 MB RAM
#    - kafka-ui                  : Saved ~307 MB RAM
#    - order-service             : Saved ~471 MB RAM
#    - payment-service           : Saved ~477 MB RAM
#    Total RAM Omitted           : ~2451 MB (~2.4 GB)
# ═══════════════════════════════════════════════════════════════

networks:
  ecommerce-lite-network:
    driver: bridge
    name: ecommerce-lite-network

volumes:
  mysql-lite-data:
    name: ecommerce-mysql-lite-data
  redis-lite-data:
    name: ecommerce-redis-lite-data

services:

  # ─────────────────────────────────────────────────────────────
  #  1. MySQL 8.0 (Low-Memory Footprint)
  # ─────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ecommerce-lite-mysql
    restart: unless-stopped
    command:
      - mysqld
      - --performance_schema=OFF
      - --innodb_buffer_pool_size=32M
      - --innodb_log_buffer_size=4M
      - --max_connections=25
      - --key_buffer_size=8M
      - --table_open_cache=64
      - --thread_cache_size=4
      - --binlog_expire_logs_seconds=259200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-product_db}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce123}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-lite-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ecommerce-lite-network
    deploy:
      resources:
        limits:
          memory: 170M
        reservations:
          memory: 100M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  #  2. Redis 7 Alpine (Minimal Session & Token Cache)
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: ecommerce-lite-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispassword} --maxmemory 16mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-lite-data:/data
    networks:
      - ecommerce-lite-network
    deploy:
      resources:
        limits:
          memory: 24M
        reservations:
          memory: 8M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  #  3. Auth Service (Sprint 1 Authentication & RBAC)
  # ─────────────────────────────────────────────────────────────
  auth-service:
    image: ${IMAGE_PREFIX:-ghcr.io/}${REPO_OWNER:-shopmart}/auth-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: ecommerce-lite-auth-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-ecommerce_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ecommerce123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      JWT_SECRET: ${JWT_SECRET:-ecommerce-super-secret-key-change-in-production-must-be-256-bits}
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_CLOUD_DISCOVERY_ENABLED: "false"
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:TieredStopAtLevel=1
        -Xms48m
        -Xmx96m
        -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=32m
        -Xss256k
    networks:
      - ecommerce-lite-network
    deploy:
      resources:
        limits:
          memory: 280M
        reservations:
          memory: 180M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 35s

  # ─────────────────────────────────────────────────────────────
  #  4. Product Service (Catalog, Category, Stock, Search)
  # ─────────────────────────────────────────────────────────────
  product-service:
    image: ${IMAGE_PREFIX:-ghcr.io/}${REPO_OWNER:-shopmart}/product-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: ecommerce-lite-product-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-product_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-ecommerce_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-ecommerce123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_CLOUD_DISCOVERY_ENABLED: "false"
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:TieredStopAtLevel=1
        -Xms48m
        -Xmx96m
        -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=32m
        -Xss256k
    networks:
      - ecommerce-lite-network
    deploy:
      resources:
        limits:
          memory: 290M
        reservations:
          memory: 190M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 35s

  # ─────────────────────────────────────────────────────────────
  #  5. API Gateway (Centralized JWT Verification & Header Injection)
  # ─────────────────────────────────────────────────────────────
  api-gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/}${REPO_OWNER:-shopmart}/api-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ecommerce-lite-api-gateway
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_CLOUD_DISCOVERY_ENABLED: "true"
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_AUTH-SERVICE_0_URI: http://auth-service:8081
      SPRING_CLOUD_DISCOVERY_CLIENT_SIMPLE_INSTANCES_PRODUCT-SERVICE_0_URI: http://product-service:8082
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
      JWT_SECRET: ${JWT_SECRET:-ecommerce-super-secret-key-change-in-production-must-be-256-bits}
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseSerialGC
        -XX:TieredStopAtLevel=1
        -Xms32m
        -Xmx64m
        -XX:MaxMetaspaceSize=96m
        -XX:ReservedCodeCacheSize=24m
        -Xss256k
    networks:
      - ecommerce-lite-network
    deploy:
      resources:
        limits:
          memory: 210M
        reservations:
          memory: 130M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ─────────────────────────────────────────────────────────────
  #  6. Frontend (React 18 + Vite 5 SPA)
  # ─────────────────────────────────────────────────────────────
  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/}${REPO_OWNER:-shopmart}/frontend:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_USE_MOCK_AUTH: "false"
    container_name: ecommerce-lite-frontend
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - ecommerce-lite-network
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q OK || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────────────────────
  #  7. Nginx Reverse Proxy (Public Entry Point - Port 80)
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-lite-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ecommerce-lite-network
    deploy:
      resources:
        limits:
          memory: 24M
        reservations:
          memory: 12M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz | grep -q OK || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
