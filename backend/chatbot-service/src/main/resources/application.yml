server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: chatbot-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ─── Database (chatbot_db) ───────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/chatbot_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ecommerce_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ChatbotServicePool
      maximum-pool-size: 10
      minimum-idle: 2

  # ─── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

# ─── Google Gemini / AI Provider Configuration ───────────────
ai:
  provider:
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    api-key: ${GEMINI_API_KEY:${AI_API_KEY:${OPENAI_API_KEY:}}}
    model: ${GEMINI_MODEL:${AI_MODEL:gemini-3.1-flash-lite}}
    temperature: ${AI_TEMPERATURE:0.2}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:15}
    max-retries: ${AI_MAX_RETRIES:2}
  memory:
    max-messages: ${AI_MEMORY_MAX_MESSAGES:20}

# ─── Eureka Client ───────────────────────────────────────────
eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    health-check-url-path: /actuator/health
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:eurekapassword@localhost:8761/eureka/}

# ─── OpenAPI / Swagger ────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ─── Actuator ────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.ecommerce.chatbot: DEBUG

