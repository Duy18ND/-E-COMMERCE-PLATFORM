spring:
  datasource:
    hikari:
      username: ${DB_USERNAME:ecommerce_user}
      password: ${DB_PASSWORD:${MYSQL_PASSWORD:ecommerce_pass}}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

logging:
  level:
    com.ecommerce.chatbot: DEBUG

