# ═══════════════════════════════════════════════════════════════
#  Chatbot Service — Production Profile (prod)
# ═══════════════════════════════════════════════════════════════
spring:
  datasource:
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    com.ecommerce.chatbot: INFO

