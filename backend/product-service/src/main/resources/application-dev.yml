# ═══════════════════════════════════════════════════════════════
#  Product Service — Development Profile (dev)
# ═══════════════════════════════════════════════════════════════
spring:
  datasource:
    hikari:
      username: ${DB_USERNAME:ecommerce_user}
      password: ${DB_PASSWORD:${MYSQL_PASSWORD:ecommerce_pass}}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.ecommerce.product: DEBUG
    org.hibernate.SQL: DEBUG