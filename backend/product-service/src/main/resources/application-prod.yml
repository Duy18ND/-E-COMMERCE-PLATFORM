# ═══════════════════════════════════════════════════════════════
#  Product Service — Production Profile (prod)
# ═══════════════════════════════════════════════════════════════
spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.ecommerce.product: INFO

