# ═══════════════════════════════════════════════════════════════
#  Discovery Server — Production Profile (prod)
# ═══════════════════════════════════════════════════════════════
spring:
  security:
    user:
      name: ${EUREKA_USER}
      password: ${EUREKA_PASSWORD}

eureka:
  server:
    enable-self-preservation: true

logging:
  level:
    root: WARN
    com.ecommerce.discovery: INFO
