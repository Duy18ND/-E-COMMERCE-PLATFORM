server:
  port: ${SERVER_PORT:8761}

spring:
  application:
    name: discovery-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Disable Spring Security auto-generated password (use fixed credentials below)
  security:
    user:
      name: ${EUREKA_USER:eureka}
      password: ${EUREKA_PASSWORD:eurekapassword}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    # This is the Eureka Server itself — it should NOT register with itself
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${spring.security.user.name}:${spring.security.user.password}@${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Wait time in ms after the last heartbeat is received before evicting the instance
    eviction-interval-timer-in-ms: 5000
    # Disable self-preservation mode in development
    enable-self-preservation: false
    renewal-percent-threshold: 0.85

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
