# ═══════════════════════════════════════════════════════════════
#  E-Commerce Platform — Nginx Reverse Proxy Configuration
#  Routes:
#    - /api/** -> Spring Cloud API Gateway (http://api-gateway:8080/api/**)
#    - /**     -> React Frontend SPA (http://frontend:80/**)
# ═══════════════════════════════════════════════════════════════

upstream frontend_upstream {
    server frontend:80;
}

upstream gateway_upstream {
    server api-gateway:8080;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Healthcheck endpoint for Docker Compose
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK\n";
    }

    # Reverse Proxy for Backend APIs (Auth, Product, Order, Cart, Payment)
    location /api/ {
        proxy_pass http://gateway_upstream/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Reverse Proxy for Frontend React SPA (with SPA router support)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
